<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue Black Calculator</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Tahoma, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
            background:
                radial-gradient(circle at top left, #12477d, transparent 35%),
                linear-gradient(135deg, #020617, #071a31, #000);
        }

        .calculator {
            width: 340px;
            padding: 25px;
            border: 1px solid #1683ff;
            border-radius: 22px;
            background: rgba(5, 13, 27, 0.95);
            box-shadow: 0 0 35px rgba(0, 132, 255, 0.35);
            animation: appear 0.6s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(25px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        #display {
            width: 100%;
            height: 80px;
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid #145da0;
            border-radius: 12px;
            outline: none;
            background: #010812;
            color: #62b4ff;
            box-shadow: inset 0 0 15px rgba(0, 123, 255, 0.2);
            font-size: 2.2rem;
            text-align: right;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            position: relative;
            overflow: hidden;
            min-height: 62px;
            border: 1px solid #164b7a;
            border-radius: 12px;
            background: #071a31;
            color: white;
            font-size: 1.35rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s ease;
        }

        button:hover {
            background: #0d3158;
            border-color: #25a7ff;
            box-shadow: 0 0 15px rgba(0, 157, 255, 0.45);
            transform: translateY(-2px);
        }

        button:active {
            transform: scale(0.92);
        }

        .operator {
            color: #41aaff;
        }

        .clear {
            color: #ff5277;
        }

        .equal {
            grid-row: span 2;
            height: 100%;
            background: linear-gradient(145deg, #087ee8, #03428c);
            border-color: #38adff;
        }

        .equal:hover {
            background: linear-gradient(145deg, #1598ff, #075ebc);
        }

        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.35);
            transform: scale(0);
            animation: ripple 0.5s linear;
            pointer-events: none;
        }

        @keyframes ripple {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }
    </style>
</head>

<body>
    <div class="calculator">
        <input type="text" id="display" readonly placeholder="0">

        <div class="buttons">
            <button class="clear" onclick="clearDisplay()">C</button>
            <button class="operator" onclick="appendValue('/')">÷</button>
            <button class="operator" onclick="appendValue('*')">×</button>
            <button class="operator" onclick="deleteLast()">⌫</button>

            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button class="operator" onclick="appendValue('-')">−</button>

            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button class="operator" onclick="appendValue('+')">+</button>

            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button class="equal" onclick="calculate()">=</button>

            <button style="grid-column: span 2" onclick="appendValue('0')">0</button>
            <button onclick="appendValue('.')">.</button>
        </div>
    </div>

    <script>
        const display = document.getElementById("display");

        function appendValue(value) {
            if (display.value === "Error") {
                display.value = "";
            }

            const operators = "+-*/";
            const lastCharacter = display.value.slice(-1);

            if (operators.includes(value) && operators.includes(lastCharacter)) {
                display.value = display.value.slice(0, -1) + value;
                return;
            }

            if (value === "." && lastCharacter === ".") return;

            if (display.value === "0" && value !== ".") {
                display.value = "";
            }

            display.value += value;
        }

        function clearDisplay() {
            display.value = "";
        }

        function deleteLast() {
            display.value = display.value.slice(0, -1);
        }

        function calculate() {
            try {
                if (!display.value) return;

                if (!/^[0-9+\-*/.() ]+$/.test(display.value)) {
                    throw new Error("Invalid expression");
                }

                const result = Function(
                    `"use strict"; return (${display.value})`
                )();

                display.value = Number.isFinite(result)
                    ? Number(result.toFixed(10))
                    : "Error";
            } catch {
                display.value = "Error";
            }
        }

        document.addEventListener("keydown", event => {
            if ("0123456789.+-*/".includes(event.key)) {
                appendValue(event.key);
            } else if (event.key === "Enter" || event.key === "=") {
                calculate();
            } else if (event.key === "Backspace") {
                deleteLast();
            } else if (event.key === "Escape" || event.key.toLowerCase() === "c") {
                clearDisplay();
            }
        });

        document.querySelectorAll("button").forEach(button => {
            button.addEventListener("click", event => {
                const ripple = document.createElement("span");
                const size = Math.max(button.clientWidth, button.clientHeight);

                ripple.className = "ripple";
                ripple.style.width = `${size}px`;
                ripple.style.height = `${size}px`;
                ripple.style.left = `${event.offsetX - size / 2}px`;
                ripple.style.top = `${event.offsetY - size / 2}px`;

                button.appendChild(ripple);
                setTimeout(() => ripple.remove(), 500);
            });
        });
    </script>
</body>
</html>
